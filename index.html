<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <title>Candy Clicker</title>
        <script src="script.js" defer></script>
        <link rel="icon" type="image/x-icon" href="favicon.ico">
    </head>
    <body>
        <div class="topInfoBoard">
            <div class="candyCpsSegment">
                <div class="candyDisplay">
                    <h1 id="candyDisplay">Candy: 0</h1>
                </div>
                <div class="cpsDisplay">
                    <h2 id="cpsDisplay">CPS: 0</h2>
                </div>
            </div>
            <div class="clickPowerDisplay">
                <h2 id="clickPowerDisplay"></h2>
            </div>
        </div>
        <div class="bodyHolder">
            <img src="Candy.svg" id="candy" class="candy">
            <div class="upgradesHolder" id="holder">
            </div>
        </div>
        <div class="miscellaneousHolder">
            <div class="stack">
                <button class="reset" id="reset">Reset</button>
                <div class="achievements" id="achievements">Achievement</div>
            </div>
            <button class="prestige" id="prestige">Prestige</button>
        </div>
    </body>
</html>
